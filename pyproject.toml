[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "war-analyzer"
version = "0.1.0"
description = "Vision and OCR prototypes for the WAR board game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "hypothesis==6.130.2",
    "pytest==9.0.3",
]
quality = [
    "mypy==2.4.0",
    "mutmut==3.8.0",
    "ruff==0.17.1",
]
vision = [
    "mss==10.0.0",
    "numpy==2.2.6",
    "opencv-python==4.11.0.86",
    "Pillow==13.0.0",
    "pynput==1.8.1",
    "pytesseract==0.3.13",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "anchor_coordinates",
    "pixel_coordinates",
    "pixel_hsv",
    "war_analyzer",
    "war_analyzer_gemini",
    "war_analyzer_resumed",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "src/anchor_coordinates.py",
    "src/pixel_coordinates.py",
    "src/pixel_hsv.py",
    "src/war_analyzer.py",
    "src/war_analyzer_gemini.py",
    "src/war_analyzer_resumed.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["tests"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["cv2", "pytesseract"]
ignore_missing_imports = true
